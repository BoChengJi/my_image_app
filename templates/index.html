<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YOLOv11 Video Stream</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 30px; background-color: #f8f9fa; }
        .container { max-width: 1000px; }
        img.stream { border: 3px solid #198754; border-radius: 10px; }
        .form-select, .btn { max-width: 300px; display: inline-block; }
        .footer { margin-top: 20px; font-size: 0.9rem; color: gray; }
    </style>
</head>
<body>
<div class="container text-center">
    <h1 class="mb-4 text-success">YOLOv11 即時模型切換與影像辨識</h1>

    <form id="modelForm" class="mb-4">
        <div class="d-flex justify-content-center align-items-center gap-2">
            <select id="modelSelect" name="model_type" class="form-select">
                {% for value, name in models %}
                    <option value="{{ value }}" {% if value == current_model %}selected{% endif %}>{{ name }}</option>
                {% endfor %}
            </select>
            <button type="submit" class="btn btn-success">切換模型</button>
        </div>
    </form>

    <img src="{{ url_for('video_feed') }}" class="stream img-fluid" width="800">

    <div class="footer mt-4">Powered by YOLOv11 + Flask</div>
</div>

<script>
    document.getElementById("modelForm").addEventListener("submit", function(e) {
        e.preventDefault();
        const modelType = document.getElementById("modelSelect").value;
        fetch('/switch_model', {
            method: 'POST',
            body: new URLSearchParams({ model_type: modelType }),
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            }
        }).then(res => res.json())
          .then(data => {
              alert(data.message);
          });
    });
</script>
</body>
</html>
